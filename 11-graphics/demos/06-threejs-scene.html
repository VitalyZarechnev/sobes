<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сцена на Three.js</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --panel: #ffffff; --border: #e2e8f0; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --fg: #e5e7eb; --muted: #94a3b8; --panel: #111827; --border: #1f2937; --accent: #60a5fa; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 12px; }
  #stage { width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; background: #020617; position: relative; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .info { font: 13px ui-monospace, monospace; color: var(--muted); margin-top: 8px; }
  a { color: var(--accent); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<main>
  <h1>Three.js: сцена, камера, свет, InstancedMesh, raycasting</h1>
  <p>Вращайте камеру мышью (OrbitControls), колесо — зум. Наведите на кубик — он подсветится (raycasting). 2 000 кубиков рисуются <b>одним</b> draw call через InstancedMesh. Нужен интернет: Three.js загружается с CDN. ← <a href="../05-threejs-and-frameworks.md">к теории</a></p>
  <div id="stage"></div>
  <div class="info" id="info"></div>
</main>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const stage = document.getElementById('stage');
  const info = document.getElementById('info');

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // ограничиваем DPR ради производительности
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020617);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  camera.position.set(18, 14, 22);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x202030, 1.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2);
  sun.position.set(10, 20, 10);
  scene.add(sun);

  // InstancedMesh: одна геометрия и материал, разные матрицы — один draw call на все экземпляры
  const COUNT = 2000;
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ roughness: 0.4 }), COUNT);
  const dummy = new THREE.Object3D();
  const color = new THREE.Color();
  for (let i = 0; i < COUNT; i++) {
    const r = 4 + Math.random() * 8;
    const theta = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * 8;
    dummy.position.set(Math.cos(theta) * r, y, Math.sin(theta) * r);
    dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    mesh.setColorAt(i, color.setHSL(0.55 + Math.random() * 0.2, 0.7, 0.55));
  }
  scene.add(mesh);

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2(10, 10);
  let hovered = -1;
  const highlight = new THREE.Color(0xfacc15);
  const saved = new THREE.Color();

  renderer.domElement.addEventListener('pointermove', (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    // Нормализованные координаты устройства: от -1 до 1
    pointer.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  });

  function resize() {
    const { width, height } = stage.getBoundingClientRect();
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  renderer.setAnimationLoop((time) => {
    if (!reduceMotion) mesh.rotation.y = time / 8000;
    controls.update();

    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObject(mesh)[0];
    const id = hit ? hit.instanceId : -1;
    if (id !== hovered) {
      if (hovered >= 0) mesh.setColorAt(hovered, saved);
      if (id >= 0) { mesh.getColorAt(id, saved); mesh.setColorAt(id, highlight); }
      mesh.instanceColor.needsUpdate = true;
      hovered = id;
    }

    renderer.render(scene, camera);
    info.textContent = `draw calls: ${renderer.info.render.calls} · треугольников: ${renderer.info.render.triangles} · под курсором: ${hovered >= 0 ? '#' + hovered : '—'}`;
  });
</script>
</body>
</html>
