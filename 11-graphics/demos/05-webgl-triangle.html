<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL2 с нуля</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --panel: #ffffff; --border: #e2e8f0; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --fg: #e5e7eb; --muted: #94a3b8; --panel: #111827; --border: #1f2937; --accent: #60a5fa; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 300px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  h1, p.lead { grid-column: 1 / -1; margin: 0; }
  h1 { font-size: 20px; }
  p.lead { color: var(--muted); }
  canvas { width: 100%; aspect-ratio: 1; background: #020617; border-radius: 12px; display: block; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: grid; gap: 12px; align-content: start; }
  label { display: grid; gap: 4px; font-size: 14px; }
  pre { margin: 0; font: 12px/1.4 ui-monospace, monospace; background: var(--bg); padding: 8px; border-radius: 8px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
  .error { color: #dc2626; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>WebGL2 с нуля: буфер, шейдеры, uniform, отрисовка</h1>
  <p class="lead">Треугольник с цветами в вершинах: GPU интерполирует цвет между вершинами (varying). Угол поворота передаётся в вершинный шейдер через uniform каждый кадр. Попробуйте отредактировать фрагментный шейдер. ← <a href="../../index.html#/p/11-graphics/04-webgl-basics">к теории</a></p>
  <canvas id="c" aria-label="Вращающийся треугольник WebGL"></canvas>
  <div class="panel">
    <label>Скорость вращения <input id="speed" type="range" min="0" max="3" step="0.1" value="1"></label>
    <label>Фрагментный шейдер (применяется при вводе)
      <textarea id="frag" rows="10" spellcheck="false" style="font: 12px/1.4 ui-monospace, monospace; width: 100%;"></textarea>
    </label>
    <pre id="log">Шейдеры скомпилированы.</pre>
  </div>
</main>
<script>
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: true });
  const log = document.getElementById('log');

  const VERTEX = `#version 300 es
in vec2 aPosition;
in vec3 aColor;
uniform float uAngle;
out vec3 vColor; // передаётся во фрагментный шейдер с интерполяцией
void main() {
  float c = cos(uAngle), s = sin(uAngle);
  vec2 p = mat2(c, s, -s, c) * aPosition; // поворот в шейдере
  gl_Position = vec4(p, 0.0, 1.0);        // clip space: от -1 до 1
  vColor = aColor;
}`;

  const FRAGMENT = `#version 300 es
precision mediump float;
in vec3 vColor;
uniform float uTime;
out vec4 outColor;
void main() {
  // Попробуйте: outColor = vec4(vColor.bgr, 1.0);
  float pulse = 0.85 + 0.15 * sin(uTime * 3.0);
  outColor = vec4(vColor * pulse, 1.0);
}`;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const message = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(message);
    }
    return shader;
  }

  function link(vsSource, fsSource) {
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fsSource));
    // Фиксируем номера атрибутов, чтобы VAO подходил к любой версии программы
    gl.bindAttribLocation(program, 0, 'aPosition');
    gl.bindAttribLocation(program, 1, 'aColor');
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    return program;
  }

  if (!gl) {
    log.textContent = 'WebGL2 не поддерживается этим браузером или отключён.';
    log.className = 'error';
  } else {
    // Данные вершин: x, y, r, g, b — чередуются в одном буфере (interleaved)
    const vertices = new Float32Array([
       0.0,  0.7,  1.0, 0.2, 0.3,
      -0.6, -0.5,  0.2, 0.8, 0.3,
       0.6, -0.5,  0.2, 0.4, 1.0,
    ]);
    const vao = gl.createVertexArray(); // запоминает настройку атрибутов
    gl.bindVertexArray(vao);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW); // один раз загружаем в память GPU
    const stride = 5 * 4; // 5 float по 4 байта
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 2 * 4);

    let program = link(VERTEX, FRAGMENT);
    const frag = document.getElementById('frag');
    frag.value = FRAGMENT;
    frag.addEventListener('input', () => {
      try {
        const next = link(VERTEX, frag.value);
        gl.deleteProgram(program);
        program = next;
        log.textContent = 'Шейдеры скомпилированы.';
        log.className = '';
      } catch (error) {
        log.textContent = String(error.message ?? error);
        log.className = 'error';
      }
    });

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const { width, height } = canvas.getBoundingClientRect();
      canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    new ResizeObserver(resize).observe(canvas);

    let angle = 0, last = performance.now();
    function frame(now) {
      const dt = (now - last) / 1000; last = now;
      angle += dt * Number(document.getElementById('speed').value);
      gl.clearColor(0.01, 0.02, 0.09, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(program);
      gl.uniform1f(gl.getUniformLocation(program, 'uAngle'), angle);
      gl.uniform1f(gl.getUniformLocation(program, 'uTime'), now / 1000);
      gl.bindVertexArray(vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3); // один draw call
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
</script>
</body>
</html>
